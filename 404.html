<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina nu există — Algoritmi elementari în C++</title>
<meta name="description" content="Pagina căutată nu există.">
<meta name="author" content="Andras Bogdan Andrei">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f55e3">
<meta name="robots" content="noindex">
<link rel="icon" href="https://andrasbogdanandrei.github.io/Algoritmi-Elementari-CodePrepper/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f7f7fb; --bg-alt:#eef0fa; --card:#ffffff; --text:#1b1d2e; --muted:#555a75; --border:#dde0ef;
  --brand:#4f55e3; --brand-2:#6b46d6; --brand-text:#ffffff; --accent:#b7790c; --link:#3a3fc9;
  --code-bg:#161829; --code-text:#e8e9f5; --chip:#e6e8fb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10111c; --bg-alt:#161829; --card:#1b1d30; --text:#ecedf7; --muted:#a9acc6; --border:#2c2f49;
    --brand:#6f74f2; --brand-2:#8a63ec; --brand-text:#ffffff; --accent:#f5b83d; --link:#9fa3ff;
    --code-bg:#0b0c16; --code-text:#e8e9f5; --chip:#25284a;
  }
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--link)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.92em;background:var(--chip);padding:.1em .35em;border-radius:5px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.sari{position:absolute;left:-999px}.sari:focus{left:16px;top:8px;background:var(--card);padding:8px 12px;z-index:10}
header.bara{border-bottom:1px solid var(--border);background:var(--card)}
header.bara .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;flex-wrap:wrap}
.sigla{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none}
.sigla img{width:30px;height:30px}
nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-weight:500}nav a:hover{color:var(--text)}
.erou{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-text);padding:56px 0 48px}
.erou h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
.erou p.lead{font-size:clamp(1.05rem,2.2vw,1.25rem);max-width:760px;margin:0 0 26px;opacity:.95}
.butoane{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;font-weight:600;text-decoration:none}
.btn.primar{background:#fff;color:#2f33a8}.btn.secundar{border:2px solid rgba(255,255,255,.75);color:#fff}
.btn:hover{transform:translateY(-1px)}
.cifre{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px;max-width:760px}
.cifre div{background:rgba(255,255,255,.13);border-radius:12px;padding:12px 14px}
.cifre b{display:block;font-size:1.7rem;line-height:1.1}
.cifre span{font-size:.92rem;opacity:.92}
section{padding:44px 0}
section.alt{background:var(--bg-alt)}
h2{font-size:clamp(1.5rem,3vw,2rem);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 24px;max-width:760px}
.grila{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grila a{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--text)}
.grila a:hover{border-color:var(--brand)}
.grila a small{display:block;color:var(--muted)}
.clasa{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 22px 10px;margin-bottom:20px}
.clasa h3{margin:0 0 4px;font-size:1.35rem}
.clasa p.info{margin:0 0 14px;color:var(--muted)}
details.cap{border-top:1px solid var(--border);padding:10px 0}
details.cap summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
details.cap summary::-webkit-details-marker{display:none}
details.cap summary::before{content:"▸";color:var(--brand);margin-right:4px}
details.cap[open] summary::before{content:"▾"}
details.cap summary .t{flex:1}
details.cap summary .n{color:var(--muted);font-weight:500;white-space:nowrap}
details.cap ul{margin:10px 0 6px;padding-left:22px;columns:2;column-gap:28px}
details.cap li{break-inside:avoid;margin:2px 0}
details.cap p.folder{margin:6px 0 4px;font-size:.95rem}
pre{background:var(--code-bg);color:var(--code-text);padding:16px 18px;border-radius:12px;overflow-x:auto;font:14px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace}
pre code{background:none;padding:0;color:inherit}
ol.pasi li{margin:6px 0}
.faq h3{font-size:1.1rem;margin:22px 0 6px}
.faq p{margin:0;max-width:820px}
.cp{display:flex;gap:24px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
.cp img{width:72px;height:72px;flex:none}
.cp h2{font-size:1.4rem}
footer{border-top:1px solid var(--border);padding:28px 0;color:var(--muted);font-size:.95rem}
footer a{color:var(--muted)}
@media (max-width:700px){
  .cifre{grid-template-columns:repeat(2,1fr)}
  details.cap ul{columns:1}
  .cp{flex-direction:column;align-items:flex-start}
  nav ul{gap:12px;font-size:.95rem}
  .erou{padding:40px 0 36px}
}
/* animații */
.erou{position:relative;overflow:hidden;isolation:isolate}
.erou::before,.erou::after{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 65%);z-index:-1;will-change:transform;pointer-events:none}
.erou::before{top:-320px;left:-180px;animation:plutire 16s ease-in-out infinite alternate}
.erou::after{bottom:-360px;right:-200px;animation:plutire 19s ease-in-out infinite alternate-reverse}
@keyframes plutire{from{transform:translate(0,0)}to{transform:translate(200px,100px)}}
.erou .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.erou h1 .c{color:#f5b83d;white-space:nowrap}
.cursor{display:inline-block;width:.08em;height:.85em;background:#f5b83d;margin-left:.08em;vertical-align:-.06em;animation:clipire 1.1s steps(1) infinite}
@keyframes clipire{50%{opacity:0}}
.intra{animation:intrare .8s cubic-bezier(.2,.7,.2,1) both}
.intra.d1{animation-delay:.12s}.intra.d2{animation-delay:.24s}.intra.d3{animation-delay:.36s}.intra.d4{animation-delay:.5s}
@keyframes intrare{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.viz{background:rgba(10,12,40,.3);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 18px 12px;box-shadow:0 24px 60px rgba(10,8,40,.3)}
.viz-t{font:600 13px ui-monospace,Consolas,monospace;opacity:.88;margin-bottom:10px;text-align:center}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz .baza{height:3px;border-radius:2px;background:rgba(255,255,255,.4);margin-top:2px}
.cifre div{transition:transform .2s ease,background .2s ease}.cifre div:hover{transform:translateY(-3px);background:rgba(255,255,255,.2)}
.js .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .reveal.vizibil{opacity:1;transform:none}
.grila a{display:flex;gap:12px;align-items:center;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.grila a img{width:40px;height:40px;border-radius:10px;flex:none;transition:transform .25s ease}
.grila a:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(40,40,120,.16)}
.grila a:hover img{transform:scale(1.1) rotate(-4deg)}
.carduri{display:grid;gap:14px}
.carduri a{display:block;border-radius:18px;transition:transform .25s ease,box-shadow .25s ease}
.carduri a:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(40,40,120,.16)}
.carduri img{width:100%;height:auto;display:block}
.clasa{transition:box-shadow .25s ease,border-color .25s ease}.clasa:hover{border-color:var(--brand);box-shadow:0 12px 30px rgba(40,40,120,.12)}
details.cap summary{align-items:center}
details.cap summary img{width:30px;height:30px;border-radius:8px;flex:none;transition:transform .2s ease}
details.cap summary:hover img{transform:scale(1.12) rotate(-4deg)}
details.cap[open] ul,details.cap[open] p.folder{animation:intrare .35s ease-out}
.sep{display:block;max-width:1100px;margin:0 auto;padding:0 20px}.sep img{width:100%;height:auto;display:block}
.btn{transition:transform .15s ease,box-shadow .15s ease}.btn:hover{box-shadow:0 10px 22px rgba(0,0,0,.18)}
footer a,.faq a{text-decoration-thickness:1px;text-underline-offset:3px}footer a:hover,.faq a:hover{text-decoration-thickness:2px}
@media (max-width:900px){.erou .grid{grid-template-columns:1fr}.viz{max-width:480px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.js .reveal{opacity:1;transform:none}}
</style>
<script>if(window.matchMedia&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&"IntersectionObserver" in window)document.documentElement.classList.add("js")</script>
</head>
<body>
<header class="bara"><div class="wrap"><a class="sigla" href="https://andrasbogdanandrei.github.io/Algoritmi-Elementari-CodePrepper/"><img src="https://andrasbogdanandrei.github.io/Algoritmi-Elementari-CodePrepper/favicon.svg" alt="" width="30" height="30">Algoritmi elementari în C++</a></div></header>
<main><section><div class="wrap">
<h1>Pagina nu există</h1>
<p class="sub">Adresa nu mai este validă sau a fost scrisă greșit. Toți algoritmii sunt pe pagina principală, organizați pe clase și capitole.</p>
<div class="butoane"><a class="btn primar" style="background:var(--brand);color:#fff" href="https://andrasbogdanandrei.github.io/Algoritmi-Elementari-CodePrepper/">Pagina principală</a>
<a class="btn" href="https://github.com/AndrasBogdanAndrei/Algoritmi-Elementari-CodePrepper">Depozitul pe GitHub</a></div>
</div></section></main>
</body>
</html>
