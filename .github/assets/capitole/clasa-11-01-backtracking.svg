<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Animație: Metoda backtracking"><title>Animație: Metoda backtracking</title><style>@keyframes bt{0.00%{transform:translate(32px,13px)}8.33%{transform:translate(19px,31px)}16.67%{transform:translate(12px,50px)}25.00%{transform:translate(19px,31px)}33.33%{transform:translate(26px,50px)}41.67%{transform:translate(19px,31px)}50.00%{transform:translate(32px,13px)}58.33%{transform:translate(45px,31px)}66.67%{transform:translate(38px,50px)}75.00%{transform:translate(45px,31px)}83.33%{transform:translate(52px,50px)}91.67%{transform:translate(45px,31px)}100.00%{transform:translate(32px,13px)}}.bt{transform:translate(32px,13px);animation:bt 5.2s ease-in-out infinite}text{font-variant-ligatures:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6fe6"/><stop offset="1" stop-color="#6a42d0"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#ig)"/><line x1="32" y1="13" x2="19" y2="31" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><line x1="32" y1="13" x2="45" y2="31" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><line x1="19" y1="31" x2="12" y2="50" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><line x1="19" y1="31" x2="26" y2="50" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><line x1="45" y1="31" x2="38" y2="50" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><line x1="45" y1="31" x2="52" y2="50" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><circle cx="32" cy="13" r="4" fill="#ffffff"/><circle cx="19" cy="31" r="4" fill="#ffffff"/><circle cx="45" cy="31" r="4" fill="#ffffff"/><circle cx="12" cy="50" r="4" fill="#ffffff"/><circle cx="26" cy="50" r="4" fill="#ffffff"/><circle cx="38" cy="50" r="4" fill="#ffffff"/><circle cx="52" cy="50" r="4" fill="#ffffff"/><circle class="bt" cx="0" cy="0" r="5.5" fill="#f5b8