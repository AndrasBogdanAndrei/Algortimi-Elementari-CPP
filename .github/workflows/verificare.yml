name: Verificare algoritmi

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilează și rulează toți algoritmii
        run: python -I scripts/verifica.py
